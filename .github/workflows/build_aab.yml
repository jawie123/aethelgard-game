name: Build Signed Release AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Release App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-game-signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
