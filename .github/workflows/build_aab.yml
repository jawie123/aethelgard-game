name: Build Signed Release AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Base64 Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Create key.properties
        run: |
          cat <<EOT > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOT

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Release App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-game-signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
